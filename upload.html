<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knowledge Base — File Upload</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .serif { font-family: 'EB Garamond', Georgia, serif; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  #drop-zone.drag-over { border-color: #0a0a0a; background-color: #fafaf9; }
</style>
</head>
<body class="bg-[#fdfcf9] text-zinc-800 antialiased min-h-screen">

  <!-- Nav -->
  <div class="border-b border-zinc-200 bg-white/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-5 sm:px-8 py-3 flex items-center justify-between text-sm">
      <div class="flex items-center gap-3">
        <span class="inline-flex w-2 h-2 rounded-full bg-zinc-900"></span>
        <span class="uppercase tracking-widest font-medium text-zinc-600">Knowledge Base</span>
      </div>
      <a href="/" class="text-zinc-500 hover:text-zinc-900 transition-colors">← Back to document</a>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-5 sm:px-8 py-16">

    <header class="mb-12">
      <p class="mono text-xs tracking-widest text-zinc-500 mb-4">VOLUME · /mnt/data/kb</p>
      <h1 class="serif text-5xl font-[600] text-zinc-900 leading-tight">File Upload</h1>
      <p class="mt-3 text-zinc-600 text-[16px] leading-7">
        Files are saved to the persistent volume at <code class="mono text-sm bg-zinc-100 px-1.5 py-0.5 rounded">/mnt/data/kb</code>
        and survive deploys and restarts.
      </p>
    </header>

    <!-- Upload form -->
    <section class="mb-14">
      <h2 class="text-sm font-semibold uppercase tracking-widest text-zinc-500 mb-4">Upload Files</h2>

      <div
        id="drop-zone"
        class="border-2 border-dashed border-zinc-300 rounded-xl p-10 text-center cursor-pointer transition-colors hover:border-zinc-500"
        onclick="document.getElementById('file-input').click()"
      >
        <svg class="mx-auto mb-4 text-zinc-400" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="text-zinc-600 font-medium">Drop files here or <span class="underline">browse</span></p>
        <p class="text-zinc-400 text-sm mt-1">Any file type · up to 100 MB each</p>
      </div>

      <form id="upload-form" class="mt-4">
        <input
          id="file-input"
          type="file"
          name="files"
          multiple
          class="hidden"
        >
        <div id="file-list" class="space-y-2 mb-4 hidden"></div>
        <button
          id="upload-btn"
          type="submit"
          disabled
          class="w-full py-3 px-6 bg-zinc-900 text-white rounded-lg font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-zinc-700 transition-colors"
        >
          Upload to /mnt/data/kb
        </button>
      </form>

      <!-- Progress / result -->
      <div id="upload-status" class="mt-4 hidden"></div>
    </section>

    <!-- Stored files -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold uppercase tracking-widest text-zinc-500">Stored Files</h2>
        <button
          onclick="loadFiles()"
          class="text-xs text-zinc-500 hover:text-zinc-900 underline transition-colors"
        >Refresh</button>
      </div>

      <div id="file-table-wrap">
        <p class="text-zinc-400 text-sm">Loading…</p>
      </div>
    </section>

  </main>

<script>
// ── Drag-and-drop ──────────────────────────────────────────────────────────────
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileList  = document.getElementById('file-list');
const uploadBtn = document.getElementById('upload-btn');

['dragenter','dragover'].forEach(evt =>
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); })
);
['dragleave','drop'].forEach(evt =>
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); })
);
dropZone.addEventListener('drop', (e) => {
  fileInput.files = e.dataTransfer.files;
  renderFileList(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => renderFileList(fileInput.files));

function renderFileList(files) {
  fileList.innerHTML = '';
  if (!files || files.length === 0) {
    fileList.classList.add('hidden');
    uploadBtn.disabled = true;
    return;
  }
  fileList.classList.remove('hidden');
  uploadBtn.disabled = false;
  Array.from(files).forEach((f) => {
    const row = document.createElement('div');
    row.className = 'flex items-center justify-between bg-zinc-50 border border-zinc-200 rounded-lg px-4 py-2.5 text-sm';
    row.innerHTML = `
      <span class="mono text-zinc-700 truncate max-w-xs">${escHtml(f.name)}</span>
      <span class="text-zinc-400 ml-4 shrink-0">${fmtSize(f.size)}</span>
    `;
    fileList.appendChild(row);
  });
}

// ── Upload ─────────────────────────────────────────────────────────────────────
document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const files = fileInput.files;
  if (!files || files.length === 0) return;

  const status = document.getElementById('upload-status');
  status.className = 'mt-4';
  status.innerHTML = `<p class="text-zinc-500 text-sm">Uploading ${files.length} file(s)…</p>`;

  const formData = new FormData();
  Array.from(files).forEach((f) => formData.append('files', f));

  try {
    const res  = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Upload failed');

    status.innerHTML = `
      <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3 text-sm text-emerald-800">
        ✓ ${data.uploaded.length} file(s) saved to <code class="mono">/mnt/data/kb</code>
      </div>`;

    // Reset form
    fileInput.value = '';
    renderFileList(null);
    loadFiles();
  } catch (err) {
    status.innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-800">
        ✗ ${escHtml(err.message)}
      </div>`;
  }
});

// ── File listing ───────────────────────────────────────────────────────────────
async function loadFiles() {
  const wrap = document.getElementById('file-table-wrap');
  wrap.innerHTML = '<p class="text-zinc-400 text-sm">Loading…</p>';
  try {
    const res  = await fetch('/files');
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Could not load files');

    if (data.files.length === 0) {
      wrap.innerHTML = '<p class="text-zinc-400 text-sm">No files stored yet.</p>';
      return;
    }

    const rows = data.files.map((f) => `
      <tr class="border-t border-zinc-100 hover:bg-zinc-50">
        <td class="py-2.5 pr-4 mono text-sm text-zinc-800">${escHtml(f.name)}</td>
        <td class="py-2.5 pr-4 text-sm text-zinc-500 text-right tabular-nums">${fmtSize(f.size)}</td>
        <td class="py-2.5 text-sm text-zinc-400 text-right tabular-nums">${new Date(f.modified).toLocaleString()}</td>
      </tr>`).join('');

    wrap.innerHTML = `
      <table class="w-full text-left">
        <thead>
          <tr class="text-xs uppercase tracking-widest text-zinc-400">
            <th class="pb-2 pr-4 font-medium">Name</th>
            <th class="pb-2 pr-4 font-medium text-right">Size</th>
            <th class="pb-2 font-medium text-right">Modified</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (err) {
    wrap.innerHTML = `<p class="text-red-500 text-sm">Error: ${escHtml(err.message)}</p>`;
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function fmtSize(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 ** 2)   return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 ** 3)   return (bytes / 1024 ** 2).toFixed(1) + ' MB';
  return (bytes / 1024 ** 3).toFixed(2) + ' GB';
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Load on page open
loadFiles();
</script>
</body>
</html>
